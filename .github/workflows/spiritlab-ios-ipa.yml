name: SpiritLab iPhone IPA (unsigned)
on:
  push:
    branches:
      - feature/spiritlab-native-ios-free-build-20261031
    paths:
      - 'ios/**'
      - '.github/workflows/spiritlab-ios-ipa.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/spiritlab-ios-ipa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install selected SpiritLab ghost icon into native asset catalog
        run: |
          set -euo pipefail
          test -s ios/SpiritLab/IconArt/SpiritLab.jpg
          mkdir -p ios/SpiritLab/Assets.xcassets/AppIcon.appiconset
          sips -s format png -z 1024 1024 ios/SpiritLab/IconArt/SpiritLab.jpg --out ios/SpiritLab/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          test -s ios/SpiritLab/Assets.xcassets/AppIcon.appiconset/AppIcon.png
      - name: Generate Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          cd ios
          xcodegen generate
      - name: Build native iOS without code signing
        run: |
          set -euo pipefail
          xcodebuild -project ios/SpiritLab.xcodeproj -scheme SpiritLab \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/SpiritLabDerived" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="$((431 + GITHUB_RUN_NUMBER))" build
      - name: Create unsigned IPA for SideStore
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/SpiritLabDerived/Build/Products/Release-iphoneos/SpiritLab.app"
          test -d "$APP"
          mkdir -p ios-build-payload/Payload ios-build-output
          ditto "$APP" ios-build-payload/Payload/SpiritLab.app
          ( cd ios-build-payload && zip -qry ../ios-build-output/SpiritLab-unsigned.ipa Payload )
          shasum -a 256 ios-build-output/SpiritLab-unsigned.ipa > ios-build-output/SHA256SUMS.txt
      - name: Attach IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpiritLab-unsigned-iPhone-IPA
          path: ios-build-output/*
          retention-days: 7
          if-no-files-found: error
      - name: Publish SideStore OTA source and unsigned IPA
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/spiritlab-native-ios-free-build-20261031'
        run: |
          set -euo pipefail
          git fetch origin refs/heads/spiritlab-ios-updates:refs/remotes/origin/spiritlab-ios-updates
          DEST="$RUNNER_TEMP/SpiritLabOTAPublish"
          git worktree add -B spiritlab-ios-updates "$DEST" origin/spiritlab-ios-updates
          python3 ios/ota_publish.py ios-build-output/SpiritLab-unsigned.ipa "$DEST/ota"
          git -C "$DEST" config user.name "github-actions[bot]"
          git -C "$DEST" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$DEST" add ota/source.json ota/SpiritLab.ipa ota/icon.png
          if git -C "$DEST" diff --cached --quiet; then
            echo 'No OTA changes'
          else
            git -C "$DEST" commit -m "Publish SpiritLab v4.3.3 OTA package"
            git -C "$DEST" push origin HEAD:refs/heads/spiritlab-ios-updates
          fi
