name: SpiritLab protected public route smoke test
on:
  push:
    branches:
      - feature/spiritlab-native-ios-free-build-20261031
    paths:
      - '.github/workflows/spiritlab-public-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check HTTPS, DNS and Access login gate
        shell: bash
        run: |
          set -euo pipefail
          URL='https://spiritlab.houseofsqueak.com/'
          echo 'DNS:'
          getent ahostsv4 spiritlab.houseofsqueak.com | head -n 3
          CODE="$(curl -sS -D headers.txt -o body.txt --connect-timeout 10 --max-time 35 -w '%{http_code}' "$URL")"
          echo "HTTP status: $CODE"
          sed -n '1,12p' headers.txt | sed -E 's/(set-cookie:).*/\1 [redacted]/I'
          test "$CODE" = 302 || test "$CODE" = 303 || test "$CODE" = 401 || test "$CODE" = 403
          grep -Eiq '^location:.*(cdn-cgi/access|cloudflareaccess\.com)|^cf-access-' headers.txt || {
            echo 'Cloudflare Access challenge not proven; review protection.'
            exit 1
          }
          echo 'Protected public HTTPS route: PASS'
